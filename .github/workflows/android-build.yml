name: Android Build

on:
  push:
    branches: [ feature/google-play-store ]
  pull_request:
    branches: [ feature/google-play-store ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Debug directory structure
        run: |
          ls -la
          ls -la android
          ls -la android/gradle/wrapper
          echo "Checking gradle-wrapper.jar"
          file android/gradle/wrapper/gradle-wrapper.jar
          echo "Checking gradle-wrapper.properties"
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for gradlew
        run: |
          chmod +x android/gradlew
          ls -l android/gradlew

      - name: Build with Gradle
        working-directory: android
        run: |
          echo "Current directory: $(pwd)"
          echo "Listing files:"
          ls -la
          echo "Listing gradle/wrapper:"
          ls -la gradle/wrapper
          echo "Running Gradle version check:"
          ./gradlew --version --stacktrace --info

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error 